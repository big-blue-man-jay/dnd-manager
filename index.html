<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DnD Manager</title>
<meta name="description" content="Charaktere, Würfel, Sitzungen und Geheimnisse für eure D&D-Kampagnen.">
<meta name="theme-color" content="#2B4790">
<script>
  // look: "light" | "dark" | "auto" (follows the device); set before first paint so nothing flashes
  (function () { var k = 'auto'; try { k = localStorage.getItem('dndm-look') || 'auto'; } catch (e) {}
    var dark = k === 'dark' || (k === 'auto' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light'); })();
</script>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="DnD Manager">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app"><div class="loading">DnD Manager startet…</div></div>
<noscript>DnD Manager braucht JavaScript.</noscript>
<script type="module" src="js/app.js"></script>
</body>
</html>
